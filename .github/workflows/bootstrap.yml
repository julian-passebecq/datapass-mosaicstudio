name: Prepare pinned development dependencies
on:
  push:
    branches: [feat/sqlrooms-studio2-foundation]
    paths: [bootstrap.request]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and generate genuine lockfile
        run: npm install --no-audit --no-fund
      - name: Retrieve commit-pinned public visual engines and reference examples
        run: npm run bootstrap
      - name: Package development dependencies for isolated local verification
        run: tar -czf development-bootstrap.tar.gz node_modules .upstream package-lock.json package.json upstreams.lock.json scripts .github .gitignore bootstrap.request README.md
      - uses: actions/upload-artifact@v4
        with:
          name: development-bootstrap
          path: development-bootstrap.tar.gz
          retention-days: 1

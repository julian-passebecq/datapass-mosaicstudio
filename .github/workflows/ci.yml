name: Studio web gate
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without peer-dependency bypasses
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test
      - name: Build actual production modules
        run: npm run build
      - name: Prepare synthetic file fixtures
        run: |
          python -m pip install duckdb==1.4.3
          npm run test:fixtures
      - name: Select and record a real browser
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if test -n "$browser"; then
            echo "CI_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
            "$browser" --version | tee qa/browser-version.txt
          else
            npx playwright install --with-deps chromium
            echo 'Playwright-managed Chromium' > qa/browser-version.txt
          fi
      - name: Real HTTP browser tests
        run: npm run test:browser
      - name: Record the genuine tested dependency lock once
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/sqlrooms-studio2-foundation'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: record tested npm dependency lock [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Package reviewable source and built web app
        if: always()
        run: |
          tar -czf studio-source.tar.gz src scripts tests docs .github package.json package-lock.json tsconfig.json vite.config.ts playwright.config.ts index.html upstreams.lock.json .gitignore README.md AGENTS.md THIRD_PARTY_NOTICES.md
          if test -d dist; then tar -czf studio-web.tar.gz -C dist .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-web-evidence
          path: |
            studio-source.tar.gz
            studio-web.tar.gz
            qa/
            test-results/
            playwright-report/
          retention-days: 3

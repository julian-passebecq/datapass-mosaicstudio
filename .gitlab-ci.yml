# Private CI mirror; GitHub remains canonical. Quote the pipeline URL in the PR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH

default:
  tags: [local-windows, imac]
  interruptible: true

stages: [test]

studio-tests:
  stage: test
  timeout: 30m
  variables:
    NODE_OPTIONS: --max-old-space-size=4096
    # Keep checkout bytes stable for source-copy and generated-contract tests.
    GIT_CONFIG_COUNT: '2'
    GIT_CONFIG_KEY_0: core.autocrlf
    GIT_CONFIG_VALUE_0: 'false'
    # Pinned upstreams contain deep snapshot paths; also inherited by bootstrap.
    GIT_CONFIG_KEY_1: core.longpaths
    GIT_CONFIG_VALUE_1: 'true'
  script:
    - $ErrorActionPreference = 'Stop'
    - $env:PATH = 'C:\Program Files\nodejs;' + $env:PATH
    - node --version
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22||(major===22&&minor<16)){console.error('Node 22.16 or later required');process.exit(1)}"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd ci --no-audit --no-fund
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd run bootstrap
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd run contracts:check
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd test
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd run build
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd run client:check
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - npm.cmd run test:visual-contracts
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
